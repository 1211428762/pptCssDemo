    <style>
      .ai-serve {
        position: fixed;
        right: 30px;
        z-index: 9;
        bottom: 100px;
      }
      .platform-ai {
        transform-origin: center;
        transform-box: fill-box;
        animation: platformAi 5s linear infinite;
      }
      .eye {
        transform-origin: center; /* 确保缩放中心在眼睛中部 */
      }

      @keyframes platformAi {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes blink {
        0%,
        40%,
        80%,
        100% {
          transform: scaleY(1);
        } /* 睁开 */
        50% {
          transform: scaleY(0.3);
        } /* 闭合 */
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
      }
      .dark::view-transition-old(root) {
        z-index: 9999;
      }
      html.dark {
        background-color: black;
        color: white;
      }
    </style>
  </head>

    <script>
      const svgRef = document.querySelector("#svgRef"); // 替换成你的 SVG 元素
      const eyes = document.querySelectorAll(".eye");

      // 1. 鼠标跟随逻辑
      document.addEventListener("mousemove", function (event) {
        if (isBlinking) return; // 如果正在眨眼，暂停跟随

        const svgRect = svgRef.getBoundingClientRect();
        const centerX = svgRect.left + svgRect.width / 2;
        const centerY = svgRect.top + svgRect.height / 2;

        const angle = Math.atan2(
          event.clientY - centerY,
          event.clientX - centerX
        );
        const distance = Math.min(
          Math.sqrt(
            Math.pow(event.clientX - centerX, 2) +
              Math.pow(event.clientY - centerY, 2)
          ) / 20,
          3
        );

        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;

        eyes.forEach((eye) => {
          eye.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
      });

      // 2. 周期性眨眼逻辑
      let isBlinking = false;

      function blink() {
        if (isBlinking) return;
        isBlinking = true;

        // 闭眼动画（压缩 Y 轴）
        eyes.forEach((eye) => {
          eye.style.transform += " scaleY(0.15)"; // 保持原有位移，叠加缩放
          eye.style.transition = "transform 0.3s ease-out";
        });

        // 150ms 后睁眼
        setTimeout(() => {
          eyes.forEach((eye) => {
            eye.style.transform = eye.style.transform.replace(
              " scaleY(0.15)",
              ""
            );
            eye.style.transition = "transform 0.3s ease-out";
          });
          isBlinking = false;
        }, 150);
      }

      // 随机眨眼（每 2-5 秒一次）
      function randomBlink() {
        if (!isBlinking && Math.random() > 0.5) {
          // 20% 概率触发
          blink();
        }
        setTimeout(randomBlink, (3 * Math.random() + 1) * 1000);
      }

      // 启动眨眼循环
      randomBlink();
      btn.onclick = toggleTheme;
      //   右上角主题切换动画
      let isDark = false;
      function toggleTheme(e) {
        const transition = document.startViewTransition(() => {
          document.documentElement.classList.toggle("dark");
          isDark = !isDark;
        });
        transition.ready.then(() => {
          const x = e.clientX;
          const y = e.clientY;
          // 从点击点到窗口最远边缘的距离，这个距离即为圆的半径，用于确定一个圆形裁剪路径 (clip path) 的最大尺寸，以便覆盖整个视窗。
          // 勾股定理：a² + b² = c²
          const radius = Math.sqrt(
            Math.max(x, window.innerWidth - x) ** 2 +
              Math.max(y, window.innerHeight - y) ** 2
          ); //一个数的平方根

          const clipPath = [
            `circle(0 at ${x}px ${y}px)`,
            `circle(${radius}px at ${x}px ${y}px)`,
          ];
          // 实现过渡的过程 circle
          document.documentElement.animate(
            {
              clipPath: isDark ? clipPath.reverse() : clipPath,
            },
            {
              duration: 500,
              easing: "ease-in",
              pseudoElement: isDark
                ? "::view-transition-old(root)"
                : "::view-transition-new(root)",
            }
          );
        });
      }
    </script>
